# =============================================================================
# Beyond Spatial Resolution — User Configuration
#
# Edit this file to control which models and experiments are run.
# Then simply execute:  python run.py
# =============================================================================

# Random seed used by all classifiers that accept a random_state argument.
random_state = 2025

# -----------------------------------------------------------------------------
# Models to run.
# Comment out or remove names to disable specific models.
# Valid options: "CART", "KNN", "MLP", "RF", "SGDC", "LinearSVC", "SVC_rbf"
# To run ALL models, leave the list empty: models = []
models = [
    "CART",
    "KNN",
    #"MLP",
    #"RF",
    "SGDC",
    "LinearSVC",
    #"SVC_rbf",
]
# -----------------------------------------------------------------------------
# Whether to generate figures after the experiments.
skip_plots = false

# -----------------------------------------------------------------------------
# Experiments
#
# experiments          : which experiments to run.
#                        Valid: "S2_4b", "S2_Allb", "PS_4b", "PS_Allb"
#                        Comment out or remove names to skip them.

experiments = [
    "S2_4b",
    "S2_Allb",
    "PS_4b",
    "PS_Allb",
]

# -----------------------------------------------------------------------------
# apply_model_on_image : if true, every experiment will also classify the
#                        full satellite image (requires imagery files in
#                        Imagery/). Set to false for a faster run without
#                        image classification.

apply_model_on_image = false

# -----------------------------------------------------------------------------
# Hyperparameter tuning (Successive Halving, scikit-learn HalvingRandomSearchCV)
#
# enabled      : true to tune every model on the training set before it is
#                evaluated; false to use scikit-learn default hyperparameters.
# n_candidates : number of random configurations sampled per model.  Each
#                round keeps the best 1/factor of them and gives the
#                survivors factor-times more training samples.
# factor       : elimination rate between rounds.
# cv_folds     : inner stratified folds used to score each configuration.
# block_size   : side (m) of the square spatial blocks used to build the inner
#                folds; all training points of a block stay in the same fold,
#                so neighbouring (near-duplicate) points never sit on both
#                sides of a split.
# Search spaces are defined in src/tuning.py.  Tuned results are saved to
# results/model_results_tuned.csv (model_results.csv keeps the defaults).

[tuning]
enabled = true
n_candidates = 81
factor = 3
cv_folds = 5
block_size = 1000
