# =============================================================================
# Beyond Spatial Resolution — User Configuration
#
# Edit this file to control which models and experiments are run.
# Then simply execute:  python run.py
# =============================================================================

# Single random seed for every source of randomness: classifiers, cross-validation
# splits and the hyperparameter search (fixed for reproducibility).
random_state = 2025

# -----------------------------------------------------------------------------
# Models to run.
# Comment out or remove names to disable specific models.
# Valid options: "CART", "KNN", "MLP", "RF", "SGDC", "LinearSVC", "SVC_rbf"
# To run ALL models, leave the list empty: models = []
models = [
    "CART",
    "KNN",
    #"MLP",
    #"RF",
    "SGDC",
    "LinearSVC",
    #"SVC_rbf",
]
# -----------------------------------------------------------------------------
# Whether to generate figures after the experiments.
skip_plots = false

# -----------------------------------------------------------------------------
# Experiments
#
# experiments          : which experiments to run.
#                        Valid: "S2_4b", "S2_Allb", "PS_4b", "PS_Allb"
#                        Comment out or remove names to skip them.

experiments = [
    "S2_4b",
    "S2_Allb",
    "PS_4b",
    "PS_Allb",
]

# -----------------------------------------------------------------------------
# apply_model_on_image : if true, every experiment will also classify the
#                        full satellite image (requires imagery files in
#                        Imagery/). Set to false for a faster run without
#                        image classification.

apply_model_on_image = false

# -----------------------------------------------------------------------------
# Hyperparameter tuning (Successive Halving, scikit-learn HalvingRandomSearchCV)
#
# enabled      : true to tune every model on the training set before it is
#                evaluated; false to use scikit-learn default hyperparameters.
# n_candidates : number of random configurations sampled per model.  Each
#                round keeps the best 1/factor of them and gives the
#                survivors factor-times more training samples.
# factor       : elimination rate between rounds.
# cv_folds     : inner stratified folds used to score each configuration.
# block_size   : side (m) of the square spatial blocks used to build the inner
#                folds; all training points of a block stay in the same fold,
#                so neighbouring (near-duplicate) points never sit on both
#                sides of a split.
# Search spaces are defined in src/tuning.py.  Tuned results are saved to
# results/model_results_tuned.csv (model_results.csv keeps the defaults).

[tuning]
enabled = true
n_candidates = 81
factor = 3
cv_folds = 5
block_size = 1000

# -----------------------------------------------------------------------------
# Confidence intervals of the validation metrics (error bars)
#
# Class-stratified spatial block bootstrap of the validation points: for each
# class, the blocks holding its points are drawn with replacement (points a few
# metres apart are not independent). The same resamples serve every model and
# experiment, so S2 - PS differences get paired intervals.
#
# n_resamples : bootstrap resamples.
# block_size  : side (m) of the square blocks.
# confidence  : coverage of the percentile intervals.
# -----------------------------------------------------------------------------
[uncertainty]
n_resamples = 2000
block_size = 1000
confidence = 0.95

# -----------------------------------------------------------------------------
# Data generation (complete run only; off by default)
#
# preprocess        : build the 3-time-series composites (30-day mean per
#                     window) of PS and S2 from the raw scenes in data/raw/
#                     (src/preprocessing.py). S2 scenes are downloaded from
#                     Google Earth Engine if missing (src/download_s2_gee.py).
# generate_points   : draw the training/validation points from the reference
#                     polygons and extract their values from the composites,
#                     rewriting data/{PS,S2}_{Training,Validation}.csv
#                     (src/generate_data_points.py).
# first_year,
# last_year         : reference dates are Jun-18 and Dec-15 of every year in
#                     this range, the same for PS and S2.
# windows           : start and end (exclusive) of each composite window, in
#                     days from the reference date (t0, t1, t2).
# training_points,
# validation_points : points per class in each set.
# Packages: requirements-data.txt.

[data_generation]
preprocess = false
generate_points = false
first_year = 2020
last_year = 2022
windows = [[-30, 0], [30, 60], [100, 130]]
training_points = 9500
validation_points = 4000

# Sentinel-2 scene filter and s2cloudless cloud/shadow mask (computed in GEE).
# cloud_filter                : starting maximum CLOUDY_PIXEL_PERCENTAGE of a scene (%).
# cloud_filter_step           : increase (%) of the maximum, up to 100, while a window has
#                               fewer than min_full_coverage_days days covering the whole ROI.
# min_full_coverage_days      : days whose selected scenes together cover the ROI (>= 99 %).
# cloud_probability_threshold : s2cloudless probability (%) above which a pixel is cloud.
# nir_dark_threshold          : NIR reflectance below which a pixel may be cloud shadow.
# cloud_projection_distance   : maximum distance (km) to search for shadows from clouds.
# buffer                      : dilation (m) of the cloud/shadow mask.
[data_generation.sentinel2]
cloud_filter = 20
cloud_filter_step = 10
min_full_coverage_days = 3
cloud_probability_threshold = 60
nir_dark_threshold = 0.15
cloud_projection_distance = 2
buffer = 100
